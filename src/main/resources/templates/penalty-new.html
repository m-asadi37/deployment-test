<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Penalty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="mb-4">Add New Penalty</h1>

    <form th:action="@{/penalty/doSave}" th:object="${obj}" method="post" class="row g-3">
        <div class="col-md-6">
            <label for="id" class="form-label">ID</label>
            <input type="text" id="id" th:field="*{id}" class="form-control" readonly>
        </div>
        <div class="col-md-6">
            <div th:each="t : ${types}" class="form-check form-check-inline">
                <input class="form-check-input" type="radio" th:field="*{subject}" id="inlineRadio1" th:value="${t.name()}">
                <label th:text="${t.name()}" class="form-check-label" for="inlineRadio1"></label>
            </div>
        </div>
        <div class="col-md-6">
            <label for="amount" class="form-label">Amount</label>
            <input type="text" id="amount" th:field="*{amount}" class="form-control">
        </div>
        <div class="col-md-6">
            <label for="occurTime" class="form-label">Occur Time</label>
            <input type="datetime-local" id="occurTime" th:field="*{occurTime}" class="form-control">
        </div>
        <div class="col-md-6">
            <label for="id2" class="form-label">Car ID</label>
            <select th:field="*{carId}" class="form-select" id="id2" aria-label="Default select example">
                <option value="" selected></option>
                <option th:each="c : ${cars}" th:text="${c.plate}" th:value="${c.id}"></option>
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
</body>
</html>
