<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="mb-4">Car List</h1>

    <a class="btn btn-success mb-3" th:href="@{/car/new}">Add New Car</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Plate</th>
            <th>Model</th>
            <th>Color</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c: ${list}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.plate}"></td>
            <td th:text="${c.model}"></td>
            <td th:text="${c.color}"></td>
            <td>
                <a class="btn btn-outline-primary btn-sm" th:href="@{/car/detail(id=${c.id})}">Edit</a>
                <a class="btn btn-outline-danger btn-sm" th:href="@{/car/doRemove(id=${c.id})}" >Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
