<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="mb-4">Add New Car</h1>

    <form th:action="@{/car/doSave}" th:object="${obj}" method="post" class="row g-3">
        <div class="col-md-6">
            <label for="id" class="form-label">ID</label>
            <input type="text" id="id" th:field="*{id}" class="form-control" readonly>
        </div>
        <div class="col-md-6">
            <label for="plate" class="form-label">Plate</label>
            <input type="text" id="plate" th:field="*{plate}" class="form-control">
        </div>
        <div class="col-md-6">
            <label for="color" class="form-label">Color</label>
            <input type="text" id="color" th:field="*{color}" class="form-control">
        </div>
        <div class="col-md-6">
            <label for="model" class="form-label">Model</label>
            <input type="text" id="model" th:field="*{model}" class="form-control">
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
</body>
</html>
