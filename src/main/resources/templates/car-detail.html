<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="mb-4">Car Details</h1>

    <form th:href="@{/car/doSave}" th:object="${obj}" method="post" class="row g-3">
        <div class="col-md-6">
            <label for="id" class="form-label">ID</label>
            <input type="text" id="id" th:field="*{id}" class="form-control" readonly>
        </div>
        <div class="col-md-6">
            <label for="plate" class="form-label">Plate</label>
            <input type="text" id="plate" th:field="*{plate}" class="form-control" readonly>
        </div>
        <div class="col-md-6">
            <label for="color" class="form-label">Color</label>
            <input type="text" id="color" th:field="*{color}" class="form-control" readonly>
        </div>
        <div class="col-md-6">
            <label for="model" class="form-label">Model</label>
            <input type="text" id="model" th:field="*{model}" class="form-control" readonly>
        </div>
    </form>

    <h2 class="mt-5">Penalties</h2>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Amount</th>
            <th>Occur Time</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p: ${obj.penalties}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.amount}"></td>
            <td th:text="${p.occurTime}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
